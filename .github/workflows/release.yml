name: Compiler et publier

# Se déclenche quand le numéro de version de package.json change sur main
# (c'est ce que fait `npm run release`). Si la version est déjà publiée, rien ne se passe.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Version déjà publiée ?
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La v$V existe déjà, rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Installer
        if: steps.v.outputs.skip != 'true'
        run: npm ci

      - name: Compiler l'installateur Windows et publier la v${{ steps.v.outputs.version }}
        if: steps.v.outputs.skip != 'true'
        run: |
          set +e
          npx electron-builder --win --publish always 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -60 build.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=electron-builder::$msg"
          fi
          exit $code
